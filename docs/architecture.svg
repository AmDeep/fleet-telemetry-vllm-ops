<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">Fleet telemetry vLLM operations architecture</title><desc id="desc">Robot telemetry travels over MQTT to a health monitor and grounded vLLM incident prompt.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#475569"/></marker></defs><rect width="1100" height="520" fill="#f8fafc"/><text x="48" y="58" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#0f172a">Fleet Telemetry + vLLM Operations</text><text x="48" y="88" font-family="Segoe UI,Arial" font-size="16" fill="#475569">Facts are computed first; language summarization sees only grounded incident data.</text><rect x="50" y="155" width="205" height="145" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="152" y="202" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#1e3a8a">Robot fleet</text><text x="152" y="237" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#1e40af">MQTT telemetry</text><text x="152" y="265" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#1e40af">battery + faults</text><rect x="330" y="155" width="205" height="145" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="432" y="202" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#92400e">Health monitor</text><text x="432" y="237" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#92400e">freshness</text><text x="432" y="265" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#92400e">state + reasons</text><rect x="610" y="155" width="205" height="145" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/><text x="712" y="202" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#312e81">vLLM copilot</text><text x="712" y="237" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#3730a3">grounded prompt</text><text x="712" y="265" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#3730a3">operator summary</text><rect x="890" y="155" width="160" height="145" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="970" y="202" text-anchor="middle" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#166534">Operator</text><text x="970" y="237" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#166534">check</text><text x="970" y="265" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#166534">respond</text><path d="M255 225 H322" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M535 225 H602" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><path d="M815 225 H882" stroke="#475569" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="385" width="1000" height="62" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="76" y="423" font-family="Segoe UI,Arial" font-size="17" fill="#334155">The model receives measured health facts, not raw authority to change robot state.</text></svg>
