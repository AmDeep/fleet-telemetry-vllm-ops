<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Fleet telemetry replay output</title><desc id="desc">Verified replay output showing one healthy unit and one faulted unit with grounded reasons.</desc><rect width="1100" height="560" fill="#0f172a"/><circle cx="52" cy="48" r="8" fill="#f87171"/><circle cx="78" cy="48" r="8" fill="#fbbf24"/><circle cx="104" cy="48" r="8" fill="#4ade80"/><text x="140" y="55" font-family="Consolas,monospace" font-size="18" fill="#cbd5e1">replay: fleet-telemetry-vllm-ops</text><rect x="52" y="105" width="996" height="115" rx="10" fill="#14532d" stroke="#22c55e"/><text x="76" y="145" font-family="Consolas,monospace" font-size="19" fill="#dcfce7">unit-01  state=healthy  battery=76%  age=2s</text><rect x="52" y="250" width="996" height="145" rx="10" fill="#450a0a" stroke="#ef4444"/><text x="76" y="290" font-family="Consolas,monospace" font-size="19" fill="#fecaca">unit-02  state=fault  battery=14%  age=60s</text><text x="76" y="330" font-family="Consolas,monospace" font-size="18" fill="#fecaca">reasons: wheel_current_high, telemetry_stale, battery_low</text><text x="52" y="470" font-family="Segoe UI,Arial" font-size="18" fill="#cbd5e1">Grounded facts are passed to the optional vLLM operations prompt.</text></svg>
