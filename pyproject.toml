[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-telemetry-vllm-ops"
version = "0.1.0"
description = "MQTT-shaped robotics fleet health monitoring with grounded vLLM incident prompts"
requires-python = ">=3.11"

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1"]
nvidia = ["pynvml>=11.5"]

[project.scripts]
fleet-monitor = "fleet_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
